<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emprende360 Partner Hub | Perfiles, matches, verticales y Rondas B2B</title>
  <meta name="description" content="Partner Hub de Emprende360: perfiles senior, expertos, partners, matches, verticales y Rondas B2B organizadas con contexto." />

  <style>
    :root{
      --bg:#020617;
      --bg2:#06111f;
      --card:rgba(255,255,255,.065);
      --card2:rgba(255,255,255,.095);
      --line:rgba(255,255,255,.14);
      --line2:rgba(244,197,66,.32);
      --text:#f8fafc;
      --muted:#94a3b8;
      --soft:#cbd5e1;
      --gold:#f4c542;
      --gold2:#ffe08a;
      --blue:#18a7ff;
      --green:#22c55e;
      --red:#fb7185;
      --violet:#a855f7;
      --shadow:0 34px 110px rgba(0,0,0,.42);
      --max:1220px;
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 8% 0%,rgba(24,167,255,.20),transparent 28%),
        radial-gradient(circle at 88% 7%,rgba(244,197,66,.15),transparent 26%),
        radial-gradient(circle at 52% 108%,rgba(34,197,94,.10),transparent 30%),
        linear-gradient(180deg,#020617 0%,#06111f 52%,#020617 100%);
      color:var(--text);
      overflow-x:hidden;
    }

    a{color:inherit;text-decoration:none}
    button,input,select{font:inherit}

    .wrap{
      width:100%;
      max-width:var(--max);
      margin:0 auto;
      padding:0 22px;
    }

    .grad{
      background:linear-gradient(90deg,#ffffff 0%,#c8ecff 45%,#ffe7a6 100%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .muted{color:var(--muted)}

    header{
      position:sticky;
      top:0;
      z-index:99;
      background:rgba(2,6,23,.84);
      backdrop-filter:blur(22px);
      border-bottom:1px solid rgba(255,255,255,.10);
    }

    .topbar{
      max-width:var(--max);
      margin:0 auto;
      padding:11px 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:11px;
      min-width:220px;
    }

    .brand-mark{
      width:40px;
      height:40px;
      border-radius:16px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#f4c542,#18a7ff);
      color:#06111f;
      font-weight:950;
      box-shadow:0 16px 45px rgba(24,167,255,.24);
    }

    .brand-title{
      font-weight:950;
      letter-spacing:-.02em;
      line-height:1;
    }

    .brand-sub{
      margin-top:3px;
      color:var(--muted);
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.17em;
      font-weight:900;
    }

    .nav{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      flex:1;
      overflow:auto;
      scrollbar-width:none;
    }

    .nav::-webkit-scrollbar{display:none}

    .tab{
      border:1px solid transparent;
      background:transparent;
      color:#cbd5e1;
      border-radius:999px;
      padding:8px 10px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
      transition:.2s ease;
    }

    .tab:hover{
      color:white;
      background:rgba(255,255,255,.07);
      border-color:rgba(255,255,255,.12);
    }

    .tab.active{
      color:white;
      background:linear-gradient(90deg,rgba(244,197,66,.18),rgba(24,167,255,.13));
      border-color:rgba(244,197,66,.32);
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      border:0;
      border-radius:999px;
      padding:12px 16px;
      font-size:13px;
      font-weight:950;
      cursor:pointer;
      white-space:nowrap;
      transition:.22s ease;
    }

    .btn:hover{transform:translateY(-2px)}

    .btn-primary{
      color:#06111f;
      background:linear-gradient(90deg,#ffe08a,#f4c542,#ffd76a);
      box-shadow:0 18px 55px rgba(244,197,66,.20);
    }

    .btn-secondary{
      color:white;
      background:rgba(255,255,255,.075);
      border:1px solid rgba(255,255,255,.15);
    }

    .btn-whatsapp{
      color:#02150a;
      background:linear-gradient(90deg,#25d366,#22c55e);
      box-shadow:0 18px 55px rgba(34,197,94,.17);
    }

    .page{padding:30px 0 72px}

    .hero{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:38px;
      padding:40px;
      background:
        radial-gradient(circle at 15% 8%,rgba(24,167,255,.22),transparent 30%),
        radial-gradient(circle at 85% 6%,rgba(244,197,66,.15),transparent 25%),
        rgba(255,255,255,.055);
      box-shadow:var(--shadow);
      backdrop-filter:blur(20px);
    }

    .hero:before{
      content:"";
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
      background-size:54px 54px;
      mask-image:linear-gradient(90deg,#000,transparent 86%);
      pointer-events:none;
    }

    .hero:after{
      content:"";
      position:absolute;
      width:560px;
      height:560px;
      border-radius:999px;
      right:-260px;
      top:-260px;
      border:1px solid rgba(244,197,66,.22);
      box-shadow:0 0 0 48px rgba(244,197,66,.035),0 0 0 96px rgba(24,167,255,.025);
      pointer-events:none;
    }

    .hero-grid{
      position:relative;
      z-index:2;
      display:grid;
      grid-template-columns:minmax(0,1.08fr) minmax(330px,.92fr);
      gap:28px;
      align-items:center;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      border:1px solid rgba(24,167,255,.26);
      background:rgba(24,167,255,.095);
      color:#bae6fd;
      border-radius:999px;
      padding:7px 12px;
      font-size:11px;
      font-weight:950;
      letter-spacing:.13em;
      text-transform:uppercase;
    }

    h1{
      margin:19px 0 0;
      font-size:clamp(39px,5.7vw,74px);
      line-height:.95;
      letter-spacing:-.065em;
      font-weight:950;
    }

    h2{
      margin:0;
      font-size:clamp(30px,4vw,52px);
      line-height:1.02;
      letter-spacing:-.052em;
      font-weight:950;
    }

    h3{
      margin:0;
      font-size:21px;
      line-height:1.18;
      letter-spacing:-.025em;
    }

    p{line-height:1.62}

    .lead{
      margin:18px 0 0;
      color:#cbd5e1;
      font-size:18px;
      line-height:1.68;
      max-width:810px;
    }

    .small{
      font-size:14px;
      line-height:1.6;
      color:#cbd5e1;
    }

    .hero-actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:26px;
    }

    .signal-panel{
      border:1px solid rgba(255,255,255,.13);
      background:rgba(2,6,23,.44);
      border-radius:30px;
      padding:22px;
      backdrop-filter:blur(20px);
    }

    .signal-panel h3{
      color:#fde68a;
      margin-bottom:12px;
    }

    .logic{
      display:grid;
      gap:10px;
      margin-top:17px;
    }

    .logic-row{
      display:grid;
      grid-template-columns:35px 1fr auto;
      align-items:center;
      gap:11px;
      border:1px solid rgba(255,255,255,.11);
      background:rgba(255,255,255,.055);
      border-radius:18px;
      padding:12px;
    }

    .logic-num{
      width:35px;
      height:35px;
      border-radius:13px;
      display:grid;
      place-items:center;
      color:#06111f;
      background:linear-gradient(135deg,#fde047,#7dd3fc);
      font-weight:950;
      font-size:13px;
    }

    .logic-row b{
      display:block;
      font-size:14px;
      color:white;
    }

    .logic-row span{
      display:block;
      color:#94a3b8;
      font-size:12px;
      line-height:1.35;
      margin-top:2px;
    }

    .logic-tag{
      border:1px solid rgba(255,255,255,.13);
      background:rgba(255,255,255,.06);
      color:#dbeafe;
      border-radius:999px;
      padding:5px 8px;
      font-size:10.5px;
      font-weight:900;
      white-space:nowrap;
    }

    .stats{
      position:relative;
      z-index:2;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
      margin-top:20px;
    }

    .stat{
      border:1px solid rgba(255,255,255,.13);
      background:rgba(255,255,255,.055);
      border-radius:24px;
      padding:19px;
    }

    .stat b{
      display:block;
      font-size:32px;
      letter-spacing:-.045em;
    }

    .stat span{
      display:block;
      color:#94a3b8;
      font-size:13px;
      line-height:1.38;
      margin-top:5px;
    }

    .section-head{
      margin-top:30px;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:18px;
      flex-wrap:wrap;
    }

    .section-head p{
      margin:10px 0 0;
      color:#cbd5e1;
      max-width:790px;
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
    }

    .input,.select{
      border:1px solid var(--line);
      background:rgba(255,255,255,.065);
      color:var(--text);
      border-radius:999px;
      padding:12px 14px;
      outline:none;
      min-width:190px;
    }

    .select option{
      background:#020617;
      color:white;
    }

    .input::placeholder{color:#64748b}

    .module{
      margin-top:18px;
      border:1px solid var(--line);
      border-radius:34px;
      padding:24px;
      background:rgba(255,255,255,.055);
      box-shadow:0 24px 85px rgba(0,0,0,.24);
      backdrop-filter:blur(18px);
    }

    .notice{
      border:1px solid rgba(244,197,66,.28);
      background:
        radial-gradient(circle at 15% 0%,rgba(244,197,66,.14),transparent 30%),
        rgba(255,255,255,.055);
      border-radius:28px;
      padding:22px;
      margin-bottom:18px;
    }

    .notice h3{
      color:white;
      margin-bottom:8px;
    }

    .notice p{
      margin:0;
      color:#cbd5e1;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
    }

    .grid-2{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:16px;
    }

    .grid-4{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px;
    }

    .card{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      border-radius:28px;
      padding:22px;
      min-height:268px;
      transition:.24s ease;
    }

    .card:hover{
      transform:translateY(-4px);
      border-color:rgba(244,197,66,.36);
      background:rgba(255,255,255,.088);
      box-shadow:0 24px 85px rgba(0,0,0,.25);
    }

    .card:after{
      content:"";
      position:absolute;
      width:190px;
      height:190px;
      border-radius:999px;
      right:-95px;
      top:-95px;
      background:rgba(24,167,255,.105);
      pointer-events:none;
    }

    .card > *{position:relative;z-index:2}

    .icon{
      width:54px;
      height:54px;
      border-radius:20px;
      display:grid;
      place-items:center;
      font-size:25px;
      color:#06111f;
      background:linear-gradient(135deg,#fde047,#7dd3fc);
      box-shadow:0 18px 50px rgba(24,167,255,.16);
      margin-bottom:16px;
    }

    .card p{
      color:#cbd5e1;
      font-size:14px;
      margin:9px 0 0;
    }

    .card-link{
      display:inline-flex;
      margin-top:17px;
      color:#fde68a;
      font-size:13px;
      font-weight:950;
    }

    .topline{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }

    .avatar{
      width:56px;
      height:56px;
      border-radius:20px;
      display:grid;
      place-items:center;
      flex:0 0 auto;
      color:#06111f;
      background:linear-gradient(135deg,#f4c542,#18a7ff);
      font-size:18px;
      font-weight:950;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      width:max-content;
      max-width:100%;
      border:1px solid rgba(255,255,255,.13);
      background:rgba(255,255,255,.06);
      color:#dbeafe;
      border-radius:999px;
      padding:6px 10px;
      font-size:11px;
      line-height:1.1;
      font-weight:900;
    }

    .tag.gold{
      border-color:rgba(244,197,66,.28);
      background:rgba(244,197,66,.10);
      color:#fde68a;
    }

    .tag.green{
      border-color:rgba(34,197,94,.28);
      background:rgba(34,197,94,.10);
      color:#bbf7d0;
    }

    .tag.blue{
      border-color:rgba(24,167,255,.28);
      background:rgba(24,167,255,.10);
      color:#bae6fd;
    }

    .tag.violet{
      border-color:rgba(168,85,247,.28);
      background:rgba(168,85,247,.11);
      color:#e9d5ff;
    }

    .tag.red{
      border-color:rgba(251,113,133,.28);
      background:rgba(251,113,133,.10);
      color:#fecdd3;
    }

    .tags{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin:12px 0 0;
    }

    .score{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:16px;
    }

    .score-bar{
      height:8px;
      flex:1;
      border-radius:999px;
      background:rgba(255,255,255,.10);
      overflow:hidden;
    }

    .score-fill{
      height:100%;
      width:var(--w);
      border-radius:999px;
      background:linear-gradient(90deg,#22c55e,#f4c542);
    }

    .score strong{
      color:#fde68a;
      font-size:12px;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:18px;
    }

    .mini{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      padding:10px 12px;
      font-size:12px;
      font-weight:950;
      background:rgba(255,255,255,.075);
      color:white;
      border:1px solid rgba(255,255,255,.14);
      transition:.2s ease;
    }

    .mini:hover{
      transform:translateY(-2px);
      color:#06111f;
      background:linear-gradient(90deg,#ffe08a,#f4c542);
      border-color:transparent;
    }

    .timeline{
      display:grid;
      gap:14px;
    }

    .timeline-item{
      display:grid;
      grid-template-columns:160px 1fr;
      gap:16px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.055);
      border-radius:24px;
      padding:18px;
    }

    .datebox{
      border:1px solid rgba(244,197,66,.28);
      background:rgba(244,197,66,.10);
      color:#fde68a;
      border-radius:18px;
      padding:14px;
      font-weight:950;
      text-align:center;
      height:max-content;
    }

    .timeline-item p{
      margin:8px 0 0;
      color:#cbd5e1;
      font-size:14px;
    }

    .final{
      margin-top:18px;
      border:1px solid rgba(244,197,66,.30);
      border-radius:34px;
      padding:30px;
      text-align:center;
      background:
        radial-gradient(circle at 10% 10%,rgba(24,167,255,.15),transparent 30%),
        radial-gradient(circle at 90% 0%,rgba(244,197,66,.16),transparent 30%),
        rgba(255,255,255,.06);
    }

    .final .lead{
      margin-left:auto;
      margin-right:auto;
      max-width:780px;
    }

    .legal{
      margin-top:18px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      border-radius:24px;
      padding:18px;
      color:#94a3b8;
      font-size:12px;
      line-height:1.6;
    }

    footer{
      border-top:1px solid rgba(255,255,255,.12);
      background:#01040d;
      padding:28px 0;
      color:#94a3b8;
      font-size:12px;
      line-height:1.6;
    }

    .footer-flex{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
    }

    footer a{
      color:#bfdbfe;
      text-decoration:underline;
      text-underline-offset:3px;
    }


    .profile-meta{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 0}
    .profile-text{color:#cbd5e1;font-size:13px;line-height:1.52;margin-top:11px}
    .profile-text strong{color:#fff}
    .profile-details{margin-top:14px;border-top:1px solid rgba(255,255,255,.09);padding-top:12px}
    .profile-details summary{cursor:pointer;color:#bfdbfe;font-size:12px;font-weight:900;list-style:none}
    .profile-details summary::-webkit-details-marker{display:none}
    .profile-details summary:after{content:" +";color:#f4c542}
    .profile-details[open] summary:after{content:" –"}
    .profile-details p{font-size:12px;line-height:1.52;margin:9px 0 0;color:#94a3b8}
    .load-more{display:flex;justify-content:center;margin-top:20px}
    .results-note{color:#94a3b8;font-size:12px;margin:0 0 14px}
    .match-names{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:14px 0}
    .match-person{padding:12px;border:1px solid rgba(255,255,255,.10);border-radius:16px;background:rgba(255,255,255,.04)}
    .match-person b{font-size:13px}
    .match-person span{display:block;color:#94a3b8;font-size:10px;margin-top:4px}
    .match-arrow{color:#f4c542;font-weight:950}
    .category-count{font-size:38px;font-weight:950;letter-spacing:-.05em;color:#7dd3fc;margin:12px 0 4px}
    .metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}
    .metric-mini{padding:9px;border:1px solid rgba(255,255,255,.10);border-radius:13px;background:rgba(255,255,255,.04);text-align:center}
    .metric-mini b{display:block;font-size:15px;color:#fde68a}
    .metric-mini span{font-size:9px;color:#94a3b8}

    @media(max-width:1100px){
      .hero-grid{grid-template-columns:1fr}
      .grid,.grid-4{grid-template-columns:repeat(2,1fr)}
      .brand{min-width:auto}
      .nav{justify-content:flex-start}
    }

    @media(max-width:760px){
      .wrap{padding:0 15px}

      .topbar{
        padding:10px 15px;
        display:grid;
        grid-template-columns:1fr auto;
      }

      .brand-sub{display:none}

      .nav{
        grid-column:1/-1;
        order:3;
        width:100%;
      }

      .brand-title{font-size:14px}

      .page{padding:18px 0 56px}

      .hero{
        padding:26px;
        border-radius:30px;
      }

      h1{
        font-size:40px;
        letter-spacing:-.047em;
      }

      .lead{font-size:16px}

      .hero-actions,.controls{
        display:grid;
        grid-template-columns:1fr;
        width:100%;
      }

      .btn,.input,.select{
        width:100%;
        min-width:0;
      }

      .stats,.grid,.grid-2,.grid-4{
        grid-template-columns:1fr;
      }

      .module{
        padding:18px;
        border-radius:28px;
      }

      .timeline-item{
        grid-template-columns:1fr;
      }

      .logic-row{
        grid-template-columns:35px 1fr;
      }

      .logic-tag{
        grid-column:2;
        width:max-content;
      }

      .footer-flex{
        display:block;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <a class="brand" href="#hub" data-route="hub">
        <div class="brand-mark">E</div>
        <div>
          <div class="brand-title">Emprende360</div>
          <div class="brand-sub">Partner Hub</div>
        </div>
      </a>

      <nav class="nav" id="tabs"></nav>

      <a class="btn btn-whatsapp" href="https://wa.me/34603153268?text=Hola%20Alberto%2C%20quiero%20valorar%20mi%20participaci%C3%B3n%20en%20el%20Partner%20Hub%20de%20Emprende360" target="_blank" rel="noopener noreferrer">Participar</a>
    </div>
  </header>

  <main class="page">
    <div class="wrap">
      <section id="hero"></section>

      <section class="section-head">
        <div>
          <h2 id="pageTitle">Partner Hub Emprende360</h2>
          <p id="pageSubtitle">La capa visible del ecosistema: perfiles, rondas, matches, verticales y oportunidades con contexto.</p>
        </div>
        <div class="controls" id="controls"></div>
      </section>

                <div class="logic-row"><div class="logic-num">1</div><div><b>Perfil</b><span>Qué hace y a quién ayuda.</span></div><div class="logic-tag">Oferta</div></div>
                <div class="logic-row"><div class="logic-num">2</div><div><b>Intención</b><span>Clientes, partners, talento o aprendizaje.</span></div><div class="logic-tag">Busca</div></div>
                <div class="logic-row"><div class="logic-num">3</div><div><b>Match</b><span>Complementariedad, buyer y modelo de colaboración.</span></div><div class="logic-tag">Hipótesis</div></div>
                <div class="logic-row"><div class="logic-num">4</div><div><b>Activación</b><span>Intro, Ronda, mesa o conversación cuando tiene sentido.</span></div><div class="logic-tag">Relación</div></div>
              </div>
            </div>
          </div>
          <div class="stats">
            <div class="stat"><b>${STATS.profiles}</b><span>perfiles visibles actualmente en la Bolsa</span></div>
            <div class="stat"><b>${STATS.categorized}</b><span>perfiles ya clasificados en categorías estratégicas</span></div>
            <div class="stat"><b>${STATS.seekPartners}</b><span>perfiles que han indicado interés en partners o alianzas</span></div>
            <div class="stat"><b>2</b><span>Rondas de Alianzas B2B confirmadas en septiembre</span></div>
          </div>
          <div class="notice" style="margin:20px 0 0">
            <p>El Hub forma parte de una infraestructura mayor de Emprende360: <strong>12.487 decisores B2B identificados en red directa</strong> y una comunidad principal de <strong>70.000+ miembros</strong>. Estas cifras pueden solaparse y no se suman como una única audiencia.</p>
          </div>
        </div>`;
      el.querySelectorAll("[data-route]").forEach(x=>x.addEventListener("click",e=>{e.preventDefault();setPage(x.dataset.route);}));
    }

    function selectHTML(key,label,options){return `<select class="select" data-filter="${esc(key)}"><option value="">${esc(label)}: todos</option>${options.map(o=>`<option value="${esc(o)}" ${state.filters[key]===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;}

    function renderControls(){
      const el=document.getElementById("controls");let h="";
      if(["participantes","matches","verticales"].includes(state.page)) h+=`<input id="search" class="input" placeholder="Buscar nombre, buyer, propuesta..." value="${esc(state.q)}">`;
      if(state.page==="participantes"){
        h+=selectHTML("category","Categoría",unique(PARTNERS.map(p=>p.category)));
        h+=selectHTML("seek","Busca",unique(PARTNERS.flatMap(p=>p.seeks)));
        h+=selectHTML("ticket","Ticket",unique(PARTNERS.flatMap(p=>p.tickets)));
      }
      if(state.page==="matches") h+=selectHTML("strength","Afinidad",unique(MATCHES.map(m=>m.strength)));
      el.innerHTML=h;
      const search=document.getElementById("search");if(search) search.addEventListener("input",e=>{state.q=e.target.value;state.visiblePartners=60;state.visibleMatches=60;renderApp();});
      el.querySelectorAll("[data-filter]").forEach(s=>s.addEventListener("change",e=>{state.filters[e.target.dataset.filter]=e.target.value;state.visiblePartners=60;state.visibleMatches=60;renderApp();}));
    }

    function tags(arr,cls=""){return `<div class="tags">${arr.filter(Boolean).map(x=>`<span class="tag ${cls}">${esc(x)}</span>`).join("")}</div>`;}

    function partnerFilter(p){
      if(!matchQ(p))return false;
      if(state.filters.category&&p.category!==state.filters.category)return false;
      if(state.filters.seek&&!p.seeks.includes(state.filters.seek))return false;
      if(state.filters.ticket&&!p.tickets.includes(state.filters.ticket))return false;
      return true;
    }

    function partnerCard(p){
      const pending=p.pending;
      return `<article class="card">
        <div class="topline"><div class="avatar">${esc(p.name.split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase())}</div><span class="tag ${pending?'red':p.category==='Por clasificar'?'violet':'blue'}">${esc(pending?'Pendiente completar':p.category)}</span></div>
        <h3>${esc(p.name)}</h3>
        <p class="small muted">${esc(p.city||'Ubicación no indicada')}</p>
        ${pending?`<p class="profile-text">Este perfil está en la Bolsa, pero su ficha todavía necesita completar contexto.</p>`:`
          <p class="profile-text"><strong>Qué hace:</strong> ${esc(trunc(p.proposal,230))}</p>
          <p class="profile-text"><strong>Cliente ideal:</strong> ${esc(trunc(p.client,190))}</p>
          ${tags(p.seeks.slice(0,4),'green')}
          ${tags(p.tickets.slice(0,3),'gold')}
          <details class="profile-details"><summary>Ver ficha completa</summary><p><strong>Propuesta:</strong> ${esc(p.proposal||'—')}</p><p><strong>Cliente ideal:</strong> ${esc(p.client||'—')}</p><p><strong>Busca:</strong> ${esc(p.seeks.join(' · ')||'—')}</p><p><strong>Modelos de colaboración:</strong> ${esc(p.collab.join(' · ')||'—')}</p><p><strong>Ticket declarado:</strong> ${esc(p.tickets.join(' · ')||'—')}</p></details>`}
        <div class="actions">
          ${p.linkedin?`<a class="mini" href="${esc(p.linkedin)}" target="_blank" rel="noopener noreferrer">LinkedIn</a>`:''}
          ${!pending?`<a class="mini" href="#matches" data-profile-match="${esc(p.name)}">Ver matches</a>`:''}
        </div>
      </article>`;
    }

    function hubHTML(){
      const tiles=[
        {icon:"👥",title:`${STATS.profiles} perfiles`,text:"Todos los perfiles de la Bolsa, con filtros por categoría, intención y ticket.",route:"participantes"},
        {icon:"🤝",title:`${STATS.matches} matches sugeridos`,text:"Hipótesis de conexión generadas con los datos declarados y listas para validación humana.",route:"matches"},
        {icon:"🧭",title:`${STATS.verticals} categorías estratégicas`,text:"Densidad real por áreas: ventas, alianzas, IA, finanzas, talento, tecnología, operaciones y más.",route:"verticales"},
        {icon:"🔁",title:"Rondas de septiembre",text:"Dos Rondas confirmadas para activar relaciones en un contexto pequeño y guiado.",route:"rondas"},
        {icon:"📈",title:"Movimiento",text:"Qué está ocurriendo ahora y qué estamos mejorando después.",route:"movimiento"}
      ];
      return `<div class="notice"><h3>La Bolsa ya no cabe en seis perfiles destacados.</h3><p>El Hub incorpora ${STATS.profiles} perfiles del Excel adjunto. ${STATS.pending} tienen la ficha pendiente de completar y ${STATS.unclassified} todavía necesitan categoría estratégica, pero siguen visibles para no perderlos.</p></div>
        <div class="grid">${tiles.map(t=>`<article class="card"><div class="icon">${t.icon}</div><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p><a class="card-link" href="#${t.route}" data-route="${t.route}">Abrir →</a></article>`).join("")}</div>
        <div class="final"><span class="pill">Participación activa</span><h2 style="margin-top:16px"><span class="grad">¿Tu perfil debería estar dentro del Hub?</span></h2><p class="lead">Si aportas experiencia B2B, tienes un buyer claro y quieres explorar relaciones con contexto, envíanos tu perfil y qué estás buscando.</p><div class="hero-actions" style="justify-content:center"><a class="btn btn-primary" href="${wa('Hola Alberto, quiero valorar mi participación en el Partner Hub. Mi perfil es: ')}" target="_blank" rel="noopener noreferrer">Solicitar participación →</a><a class="btn btn-secondary" href="${LINKS.agenda}" target="_blank" rel="noopener noreferrer">Ver agenda</a><a class="btn btn-secondary" href="${LINKS.impulso}" target="_blank" rel="noopener noreferrer">Conocer Impulso B2B</a></div></div>`;
    }

    function participantesHTML(){
      const list=PARTNERS.filter(partnerFilter).sort((a,b)=>a.pending-b.pending||a.name.localeCompare(b.name,'es'));
      const visible=list.slice(0,state.visiblePartners);
      return `<div class="results-note">${list.length} perfiles encontrados · mostrando ${visible.length}</div><div class="grid">${visible.map(partnerCard).join("")}</div>${visible.length<list.length?`<div class="load-more"><button class="btn btn-secondary" id="morePartners">Mostrar 60 más</button></div>`:''}`;
    }

    function matchFilter(m){
      if(!matchQ(m))return false;
      if(state.filters.strength&&m.strength!==state.filters.strength)return false;
      return true;
    }

    function matchCard(m){
      return `<article class="card">
        <div class="topline"><span class="tag gold">${esc(m.strength)}</span><span class="tag blue">Hipótesis</span></div>
        <div class="match-names"><div class="match-person"><b>${esc(m.aName)}</b><span>${esc(m.aCategory)}</span></div><div class="match-arrow">↔</div><div class="match-person"><b>${esc(m.bName)}</b><span>${esc(m.bCategory)}</span></div></div>
        <p>${esc(m.reason)}</p>
        <div class="actions">${m.aLinkedin?`<a class="mini" href="${esc(m.aLinkedin)}" target="_blank" rel="noopener noreferrer">LinkedIn A</a>`:''}${m.bLinkedin?`<a class="mini" href="${esc(m.bLinkedin)}" target="_blank" rel="noopener noreferrer">LinkedIn B</a>`:''}<a class="mini" href="${wa('Hola Alberto, quiero revisar este posible match del Partner Hub: '+m.aName+' ↔ '+m.bName+'. Mi contexto es: ')}" target="_blank" rel="noopener noreferrer">Revisar posible intro</a></div>
      </article>`;
    }

    function matchesHTML(){
      const list=MATCHES.filter(matchFilter);const visible=list.slice(0,state.visibleMatches);
      return `<div class="notice"><h3>Los matches son hipótesis, no intros automáticas.</h3><p>Se han generado usando exclusivamente datos declarados en la Bolsa: categoría, cliente ideal, interés en alianzas y modelos de colaboración. Antes de conectar a dos personas hay que validar contexto e interés por ambas partes.</p></div><div class="results-note">${list.length} hipótesis encontradas · mostrando ${visible.length}</div><div class="grid">${visible.map(matchCard).join("")}</div>${visible.length<list.length?`<div class="load-more"><button class="btn btn-secondary" id="moreMatches">Mostrar 60 más</button></div>`:''}`;
    }

    function verticalesHTML(){
      const q=state.q.trim().toLowerCase();const list=VERTICALS.filter(v=>!q||JSON.stringify(v).toLowerCase().includes(q));
      return `<div class="notice"><h3>La densidad real de la Bolsa.</h3><p>Estas categorías vienen del propio Excel. No representan “mercados garantizados”; muestran dónde ya hay suficiente número de perfiles para segmentar mejor y estudiar Rondas, mesas o cruces.</p></div><div class="grid">${list.map(v=>`<article class="card"><div class="icon">${v.icon}</div><h3>${esc(v.name)}</h3><div class="category-count">${v.count}</div><p>perfiles clasificados en esta categoría.</p><div class="metric-row"><div class="metric-mini"><b>${v.partners}</b><span>buscan partners</span></div><div class="metric-mini"><b>${v.clients}</b><span>buscan clientes</span></div><div class="metric-mini"><b>${v.talent}</b><span>buscan talento</span></div></div>${v.topTickets.length?`<p><strong>Tickets frecuentes:</strong> ${esc(v.topTickets.join(' · '))}</p>`:''}<div class="actions"><a class="mini" href="#participantes" data-category="${esc(v.name)}">Ver perfiles</a></div></article>`).join("")}</div><div class="legal">Además hay ${STATS.unclassified} perfiles todavía por clasificar y ${STATS.pending} fichas pendientes de completar. Permanecen en la vista de perfiles, pero no los contamos como verticales.</div>`;
    }

    function rondasHTML(){return `<div class="notice"><h3>Septiembre: dos Rondas de Alianzas B2B.</h3><p>No son networking abierto. Buscan combinar perfiles complementarios, buyers compatibles y cruces preparados para generar mejores siguientes conversaciones.</p></div><div class="timeline">${ROUNDS.map(r=>`<article class="timeline-item"><div class="datebox">${esc(r.date)}</div><div><div class="tags"><span class="tag gold">${esc(r.status)}</span><span class="tag blue">${esc(r.format)}</span></div><h3 style="margin-top:10px">${esc(r.title)}</h3><p>${esc(r.text)}</p><div class="actions"><a class="mini" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.cta)}</a></div></div></article>`).join("")}</div><div class="notice" style="margin-top:22px"><h3>Otros contextos confirmados · septiembre y octubre</h3><p>Los Foros y sesiones amplían los puntos de entrada para conocer perfiles y abrir conversaciones alrededor de problemas concretos.</p></div><div class="grid">${EVENTS.map(e=>`<article class="card" style="min-height:205px"><span class="tag blue">${esc(e.type)}</span><h3 style="margin-top:14px">${esc(e.title)}</h3><p><strong>${esc(e.date)}</strong></p><div class="actions"><a class="mini" href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">Ver evento</a></div></article>`).join("")}</div><div class="final"><span class="pill">Agenda Emprende360</span><h2 style="margin-top:16px">¿Quieres ver todas las próximas conversaciones?</h2><div class="hero-actions" style="justify-content:center"><a class="btn btn-primary" href="${LINKS.agenda}" target="_blank" rel="noopener noreferrer">Ver agenda completa →</a><a class="btn btn-secondary" href="${LINKS.eventsForm}" target="_blank" rel="noopener noreferrer">Recibir próximos eventos</a></div></div>`;}

    function movimientoHTML(){return `<div class="notice"><h3>Movimiento real antes que roadmap grandilocuente.</h3><p>Mostramos lo que ya está ocurriendo y los siguientes pasos concretos que mejoran la calidad de la red.</p></div><div class="timeline">${MOVEMENT.map(m=>`<article class="timeline-item"><div class="datebox">${esc(m.date)}</div><div><div class="tags"><span class="tag gold">${esc(m.metric)}</span></div><h3 style="margin-top:10px">${esc(m.title)}</h3><p>${esc(m.text)}</p></div></article>`).join("")}</div><div class="final"><span class="pill">Siguiente relación</span><h2 style="margin-top:16px">El Hub mejora cuando conocemos mejor a cada perfil.</h2><p class="lead">Si tu ficha está incompleta o quieres actualizar qué haces, qué buscas o con quién te interesa hablar, escríbenos.</p><div class="hero-actions" style="justify-content:center"><a class="btn btn-primary" href="${wa('Hola Alberto, quiero actualizar o completar mi perfil del Partner Hub. Mi nombre es: ')}" target="_blank" rel="noopener noreferrer">Actualizar mi perfil →</a></div></div>`;}

    function render(){const p=currentPage();document.getElementById("pageTitle").textContent=p.title;document.getElementById("pageSubtitle").textContent=p.subtitle;renderTabs();renderHero();renderControls();renderApp();}
    function renderApp(){const f={hub:hubHTML,participantes:participantesHTML,matches:matchesHTML,verticales:verticalesHTML,rondas:rondasHTML,movimiento:movimientoHTML};document.getElementById("app").innerHTML=(f[state.page]||hubHTML)();document.querySelectorAll("[data-route]").forEach(x=>x.addEventListener("click",e=>{e.preventDefault();setPage(x.dataset.route);}));document.querySelectorAll("[data-profile-match]").forEach(x=>x.addEventListener("click",e=>{e.preventDefault();setPage('matches',{q:x.dataset.profileMatch});}));document.querySelectorAll("[data-category]").forEach(x=>x.addEventListener("click",e=>{e.preventDefault();setPage('participantes',{filters:{category:x.dataset.category}});}));const mp=document.getElementById('morePartners');if(mp)mp.addEventListener('click',()=>{state.visiblePartners+=60;renderApp();});const mm=document.getElementById('moreMatches');if(mm)mm.addEventListener('click',()=>{state.visibleMatches+=60;renderApp();});}
    function init(){const h=location.hash.replace('#','');if(PAGES.some(p=>p.id===h))state.page=h;window.addEventListener('hashchange',()=>{const x=location.hash.replace('#','');if(PAGES.some(p=>p.id===x)){state.page=x;state.q='';state.filters={};state.visiblePartners=60;state.visibleMatches=60;render();}});render();}
    init();
  </script>
</body>
</html>
