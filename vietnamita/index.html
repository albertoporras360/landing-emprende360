function card(x){const z=st(x.id);return `<div class="card expr ${z.learned?'learned':''}" id="e${x.id}"><div class="expr-top"><input class="check" type="checkbox" ${z.learned?'checked':''} onchange="App.learn(${x.id},this.checked)"><div style="flex:1"><div class="es">${esc(x.es)}</div><div class="vi">${esc(x.vi)}</div><div class="phon">${esc(x.phon)}</div><div class="meta"><span class="badge">${esc(x.type)}</span><span class="badge">${esc(x.cat)}</span><span class="badge">${esc(x.priority.split('—')[0].trim())}</span>${z.real?'<span class="badge" style="color:#8ff0c5">vida real ✓</span>':''}</div></div>${viVoice?`<button class="audio" onclick='App.say(${JSON.stringify(x.vi)})'>🔊</button>`:`<button class="audio" disabled>🔇</button>`}</div><div class="context"><b>Ahora úsala en contexto</b><div style="margin-top:6px">${esc(x.ctx_es)}</div><div class="ctxvi">${esc(x.ctx_vi)}</div><div class="ctxph">${esc(x.ctx_phon)}</div><div style="margin-top:9px;display:flex;gap:7px;flex-wrap:wrap">${viVoice?`<button class="btn sm" onclick='App.say(${JSON.stringify(x.ctx_vi)},true)'>🔊 escuchar contexto</button>`:''}<label class="btn sm"><input type="checkbox" ${z.real?'checked':''} onchange="App.real(${x.id},this.checked)"> La he usado de verdad</label></div></div></div>`}
function renderHome(){const now=clampDate(isoLocal()),ar=itemsDate(now),l=learnedCount(ar),total=learnedCount(),du=due().length;app.innerHTML=head('Hoy · '+prettyDate(now),phase(now))+`<div class="hero"><div class="card"><div class="muted" style="font-size:11px;letter-spacing:.08em">PLAN 1 SEP → 31 DIC 2026</div><h2>Solo <span class="accent">5 expresiones al día.</span><br>Pero que salgan de verdad.</h2><p class="muted">610 elementos priorizados. Aprendes el chunk, lo marcas, aparece su uso en contexto y entra automáticamente en repaso espaciado.</p><div class="progress"><i style="width:${pct(total,610)}%"></i></div><div class="sub">${total}/610 aprendidas · ${du} repasos vencidos</div><div style="margin-top:15px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-route="day/${now}">Abrir las 5 de hoy</button><button class="btn" data-route="review">Repasar ahora (${du})</button></div></div><div class="card"><div class="metric"><small>Objetivo diario</small><strong>5</strong><span class="muted">expresiones / palabras núcleo</span></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><div class="metric"><small>Hoy</small><strong>${l}/5</strong><span class="muted">marcadas aprendidas</span></div></div></div><div class="section"><h2>Las 5 de hoy</h2><button class="btn sm" data-route="day/${now}">Ver día completo</button></div><div class="grid g2">${ar.map(card).join('')}</div><div class="section"><h2>Regla fonética</h2></div><div class="card"><div class="legend"><div><b>↗</b><br><span class="muted">sube</span></div><div><b>↘</b><br><span class="muted">baja</span></div><div><b>↘↗</b><br><span class="muted">baja y sube</span></div><div><b>↓</b><br><span class="muted">grave, corto</span></div></div><p class="muted">a* / o* / u* indican sonidos vietnamitas sin equivalente exacto en español. La fonética es una <b>puente</b>; el modelo definitivo es la voz nativa.</p></div>`}
function renderDay(d){if(d<START||d>END)return go('calendar');const ar=itemsDate(d),l=learnedCount(ar),idx=ar[0]?.dayIndex||1;app.innerHTML=head('Día '+idx+' · '+prettyDate(d),phase(d))+`<div class="grid g2"><div class="card"><div class="muted">OBJETIVO</div><h2 style="margin:5px 0">5 expresiones. 10–20 minutos.</h2><p class="muted">Primero mira español → intenta recordar vietnamita → escucha → repite 3 veces → marca solo cuando puedas recuperarla sin mirar.</p><div class="progress"><i style="width:${pct(l,5)}%"></i></div><div class="sub">${l}/5 aprendidas</div><div style="margin-top:13px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="App.markDay('${d}',true)">Marcar las 5 como aprendidas</button><button class="btn primary" onclick="App.quiz('${d}')">Test de las 5</button></div></div><div class="card"><h3>Micro-misión</h3><p>Cuando completes las 5, di las cinco en voz alta sin mirar. Después utiliza <b>al menos una</b> con una persona vietnamita durante el día.</p><div class="calendar-note">No acumules por acumular. Si ya conoces las cinco, márcalas y avanza. Si no salen rápido, el repaso manda.</div></div></div><div class="section"><h2>Las 5 expresiones</h2></div><div class="grid g2">${ar.map(card).join('')}</div><div style="display:flex;justify-content:space-between;margin-top:16px"><button class="btn" data-route="day/${addDays(d,-1)}" ${d===START?'disabled':''}>← día anterior</button><button class="btn" data-route="day/${addDays(d,1)}" ${d===END?'disabled':''}>día siguiente →</button></div>`}
function renderCalendar(){const now=clampDate(isoLocal());let h=head('Calendario completo','1 de septiembre → 31 de diciembre de 2026 · 122 días · 610 elementos')+'<div class="days">';let last='';for(let d=new Date(START+'T12:00:00');d<=new Date(END+'T12:00:00');d.setDate(d.getDate()+1)){const s=d.toISOString().slice(0,10),m=MONTHS[d.getMonth()];if(m!==last){h+=`<div class="month-title">${m.toUpperCase()} · ${m==='septiembre'?'base y supervivencia':m==='octubre'?'vida real y social':m==='noviembre'?'explicar, trabajo y problemas':'naturalidad y autonomía'}</div>`;last=m}const ar=itemsDate(s),l=learnedCount(ar);h+=`<button data-route="day/${s}" class="card daybtn ${s===now?'current':''} ${l===5?'done':''}"><div class="dn">${s===now?'HOY · ':''}DÍA ${ar[0].dayIndex}</div><b>${d.getDate()} ${m.slice(0,3)}</b><small>${l}/5 aprendidas</small></button>`}h+='</div>';app.innerHTML=h}
function renderReview(){const ar=due();app.innerHTML=head('Repaso espaciado','1 → 3 → 7 → 14 → 30 → 60 días')+`<div class="grid g3"><div class="card metric"><small>Vencidas</small><strong>${ar.length}</strong></div><div class="card metric"><small>Aprendidas</small><strong>${learnedCount()}</strong></div><div class="card metric"><small>Usadas en vida real</small><strong>${ITEMS.filter(x=>st(x.id).real).length}</strong></div></div><div class="section"><h2>Para recuperar hoy</h2></div><div class="card">${ar.length?ar.slice(0,50).map(x=>`<div class="reviewrow"><div><b>${esc(x.es)}</b><div class="vi" style="font-size:17px">${esc(x.vi)}</div><div class="phon">${esc(x.phon)}</div></div><div style="display:flex;gap:6px"><button class="btn sm" onclick="App.review(${x.id},false)">Me costó</button><button class="btn sm primary" onclick="App.review(${x.id},true)">Lo sé</button></div></div>`).join(''):'<div style="padding:25px;text-align:center" class="muted">No tienes repasos vencidos ahora.</div>'}</div>`}
function renderLibrary(){app.innerHTML=head('610 elementos','Búsqueda rápida por español, vietnamita o categoría')+`<div class="filters"><input id="q" class="input" placeholder="Buscar…"><select id="cat" class="select"><option value="">Todas las categorías</option>${[...new Set(ITEMS.map(x=>x.cat))].sort().map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div id="lib"></div>`;const draw=()=>{const qv=q.value.toLowerCase(),cv=cat.value;const ar=ITEMS.filter(x=>(!qv||(x.es+x.vi+x.phon).toLowerCase().includes(qv))&&(!cv||x.cat===cv));lib.innerHTML=`<div class="tablebox"><table class="table"><thead><tr><th>Fecha</th><th>Español</th><th>Vietnamita</th><th>Fonética</th><th>Estado</th></tr></thead><tbody>${ar.map(x=>`<tr><td><button class="btn sm" data-route="day/${x.date}">${x.date.slice(5)}</button></td><td>${esc(x.es)}</td><td style="font-weight:750">${esc(x.vi)}</td><td class="phon">${esc(x.phon)}</td><td>${st(x.id).learned?'✓ aprendida':'—'}</td></tr>`).join('')}</tbody></table></div>`};q.oninput=draw;cat.onchange=draw;draw()}
function renderReferences(){const block=(title,key)=>`<div class="section"><h2>${title}</h2></div><div class="tablebox"><table class="table"><thead><tr><th>Español</th><th>Vietnamita</th><th>Fonética</th><th></th></tr></thead><tbody>${REFS[key].map(r=>`<tr><td>${esc(r[0])}</td><td style="font-weight:800">${esc(r[1])}</td><td class="phon">${esc(r[2])}</td><td>${viVoice?`<button class="btn sm" onclick='App.say(${JSON.stringify(r[1])})'>🔊</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;app.innerHTML=head('Referencias rápidas','No cuentan dentro de las 5 diarias. Consúltalas cuando las necesites.')+block('Números esenciales','numbers')+block('Días de la semana','weekdays')+block('Meses','months')+block('Pronombres / tratamientos','pronouns')}
function renderProgress(){const total=learnedCount(),real=ITEMS.filter(x=>st(x.id).real).length,days=[...new Set(ITEMS.map(x=>x.date))],done=days.filter(d=>learnedCount(itemsDate(d))===5).length;app.innerHTML=head('Progreso','La métrica principal es recuperación + uso, no solo casillas.')+`<div class="grid g4"><div class="card metric"><small>Aprendidas</small><strong>${total}</strong><span class="muted">/610</span></div><div class="card metric"><small>Días 5/5</small><strong>${done}</strong><span class="muted">/122</span></div><div class="card metric"><small>Vida real</small><strong>${real}</strong><span class="muted">expresiones</span></div><div class="card metric"><small>Repaso pendiente</small><strong>${due().length}</strong></div></div><div class="section"><h2>Progreso por mes</h2></div><div class="grid g4">${[['septiembre','2026-09'],['octubre','2026-10'],['noviembre','2026-11'],['diciembre','2026-12']].map(([m,p])=>{const ar=ITEMS.filter(x=>x.date.startsWith(p)),l=learnedCount(ar);return `<div class="card"><b>${m.toUpperCase()}</b><div style="font-size:27px;font-weight:850;margin:7px 0">${pct(l,ar.length)}%</div><div class="progress"><i style="width:${pct(l,ar.length)}%"></i></div><div class="sub">${l}/${ar.length}</div></div>`}).join('')}</div><div class="section"><h2>Copia de seguridad</h2></div><div class="card"><button class="btn" onclick="App.exportData()">Exportar progreso JSON</button> <label class="btn">Importar JSON<input type="file" accept=".json" style="display:none" onchange="App.importData(this)"></label></div>`}
function renderSettings(){const vis=voices.filter(v=>/^vi($|-|_)/i.test(v.lang||''));app.innerHTML=head('Audio y fonética','Nunca usar una voz española/inglesa como sustituto del vietnamita.')+`<div class="grid g2"><div class="card"><h2>Voz vietnamita</h2>${vis.length?`<select id="voiceSel" class="select" style="width:100%">${vis.map(v=>`<option ${viVoice&&v.name===viVoice.name?'selected':''}>${esc(v.name)}</option>`).join('')}</select><label class="muted" style="display:block;margin-top:12px">Velocidad</label><input id="rate" type="range" min="0.55" max="1.05" step="0.05" value="${S.settings.rate}" style="width:100%"><button class="btn primary" style="margin-top:12px" onclick="App.saveVoice()">Guardar y probar</button>`:`<div class="calendar-note">Este dispositivo no expone ninguna voz <b>vi-VN</b>. Por precisión, el audio está desactivado. La plataforma sigue funcionando con vietnamita + fonética.</div>`}</div><div class="card"><h2>Cómo leer la fonética</h2><p><b>j</b> ≈ jota española; <b>ñ</b> ≈ ñ; <b>y</b> ≈ “ya”; <b>ng</b> es nasal; <b>sh</b> aproxima ciertos sonidos sureños.</p><p><b>a* / o* / u*</b> son sonidos sin equivalente exacto. No intentes convertirlos en castellano puro.</p><div class="legend"><div>↗ sube</div><div>↘ baja</div><div>↘↗ baja-sube</div><div>↓ grave/corto</div></div><p class="muted">Modelo objetivo: vietnamita del sur / Saigón. La fonética solo acelera el arranque; cuanto antes puedas copiar audio nativo sin leerla, mejor.</p></div></div>`}
function render(){const r=route(),a=r.split('/');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===a[0]));if(a[0]==='day')return renderDay(a[1]);({home:renderHome,calendar:renderCalendar,review:renderReview,library:renderLibrary,references:renderReferences,progress:renderProgress,settings:renderSettings}[a[0]]||renderHome)()}
function learn(id,v){const z=st(id);z.learned=v;if(v){if(!z.learnedAt)z.learnedAt=isoLocal();z.reviewStage=0;z.next=addDays(isoLocal(),1)}else{z.learnedAt=null;z.next=null;z.reviewStage=0}save();render()}
function review(id,good){const z=st(id),ints=[1,3,7,14,30,60];if(good)z.reviewStage=Math.min(z.reviewStage+1,ints.length-1);else z.reviewStage=0;z.next=addDays(isoLocal(),ints[z.reviewStage]);save();renderReview();toastMsg(good?'Repaso superado ✓':'Vuelve mañana')}
function markDay(d,v){itemsDate(d).forEach(x=>{const z=st(x.id);z.learned=v;z.learnedAt=v?(z.learnedAt||isoLocal()):null;z.reviewStage=0;z.next=v?addDays(isoLocal(),1):null});save();renderDay(d)}
function quiz(d){const ar=itemsDate(d);let qi=0,score=0;function draw(){if(qi>=ar.length){S.tests[d]={score,date:isoLocal()};save();modalBody.innerHTML=`<div style="display:flex;justify-content:space-between"><h2>Resultado</h2><button class="btn sm" onclick="App.close()">✕</button></div><div style="font-size:54px;font-weight:900;text-align:center;margin:35px 0">${score}/5</div><p class="muted" style="text-align:center">${score===5?'Perfecto. Intenta decir las cinco ahora sin mirar.':score>=3?'Bien. Repite las que fallaste hoy.':'No avances por volumen: repite estas cinco.'}</p>`;return}const x=ar[qi],others=ar.filter(y=>y.id!==x.id).sort(()=>Math.random()-.5).slice(0,3),choices=[x,...others].sort(()=>Math.random()-.5);modalBody.innerHTML=`<div style="display:flex;justify-content:space-between"><span class="pill">${qi+1}/5</span><button class="btn sm" onclick="App.close()">✕</button></div><div class="quizbox"><div class="qprompt">${esc(x.es)}</div><div class="choices">${choices.map(c=>`<button class="choice" onclick="App.answerQuiz(${x.id},${c.id},this)">${esc(c.vi)}</button>`).join('')}</div></div>`}window._quiz={ar,get qi(){return qi},next(ok){if(ok)score++;qi++;setTimeout(draw,550)}};modal.classList.add('open');draw()}
function answerQuiz(correct,chosen,el){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(correct===chosen){el.classList.add('correct');window._quiz.next(true)}else{el.classList.add('wrong');window._quiz.next(false)}}
const App={learn,real(id,v){st(id).real=v;save();render()},say:speak,review,markDay,quiz,answerQuiz,close(){modal.classList.remove('open')},saveVoice(){S.settings.voiceName=voiceSel.value;S.settings.rate=+rate.value;save();detectVoices();if(viVoice)speak('Xin chào. Tôi đang học tiếng Việt.',true);renderSettings()},exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='viet5-progreso-sep-dic-2026.json';a.click();URL.revokeObjectURL(a.href)},importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(structuredClone(DEF),JSON.parse(r.result));save();render();toastMsg('Progreso importado ✓')}catch(e){toastMsg('JSON no válido')}};r.readAsText(f)}};window.App=App;modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});window.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});render();
</script></body></html>
