function toastMsg(t){toast.textContent=t;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1700)}
function pct(a,b){return b?Math.round(a/b*100):0}
function dayItems(ds){return ITEMS.filter(x=>x.date===ds)}
function learnedCount(ar=ITEMS){return ar.filter(x=>state(x.id).learned).length}
function dueItems(){const t=iso();return ITEMS.filter(x=>{const s=state(x.id);return s.learned&&s.next&&s.next<=t})}
function currentDate(){const t=iso();return t<"2026-09-01"?"2026-09-01":t>"2026-12-31"?"2026-12-31":t}
function route(){return(location.hash||"#home").slice(1)}function go(r){location.hash="#"+r}
document.addEventListener("click",e=>{const b=e.target.closest("[data-route]");if(b){e.preventDefault();go(b.dataset.route)}});window.addEventListener("hashchange",render);

function idb(){return new Promise((resolve,reject)=>{const r=indexedDB.open("viet5_native_audio",1);r.onupgradeneeded=()=>r.result.createObjectStore("audio");r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbPut(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("audio","readwrite");tx.objectStore("audio").put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function dbGet(k){const db=await idb();return new Promise((res,rej)=>{const r=db.transaction("audio").objectStore("audio").get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function dbDel(k){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("audio","readwrite");tx.objectStore("audio").delete(k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function keyFor(text){return "t_"+btoa(unescape(encodeURIComponent(text))).replace(/[/+=]/g,"_").slice(0,160)}

function loadVoices(){
 if(!("speechSynthesis"in window)){viVoices=[];selectedVoice=null;return}
 voices=speechSynthesis.getVoices();viVoices=voices.filter(v=>/^vi([-_]|$)/i.test(v.lang||""));
 selectedVoice=viVoices.find(v=>v.name===S.settings.voiceName)||viVoices.find(v=>/google|microsoft|neural|natural|premium/i.test(v.name))||viVoices[0]||null;
 if(selectedVoice&&S.settings.voiceName!==selectedVoice.name){S.settings.voiceName=selectedVoice.name;save()}
}
if("speechSynthesis"in window){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(route()==="audio")renderAudio()}}

async function playNative(text,rate=1){
 const blob=await dbGet(keyFor(text));if(!blob)return false;
 if(currentAudio)currentAudio.pause();currentAudio=new Audio(URL.createObjectURL(blob));currentAudio.playbackRate=rate;await currentAudio.play();return true
}
function playSystem(text,rate=1){
 return new Promise(resolve=>{
  if(!selectedVoice||!("speechSynthesis"in window)){resolve(false);return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.voice=selectedVoice;u.lang=selectedVoice.lang||"vi-VN";u.rate=Math.max(.55,Math.min(1.2,rate*S.settings.speed));u.pitch=1;u.volume=1;u.onend=()=>resolve(true);u.onerror=()=>resolve(false);speechSynthesis.speak(u)
 })
}
function googleUrl(text,slow=false){
 const q=encodeURIComponent(text);return `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi-VN&ttsspeed=${slow?".24":"1"}&q=${q}`;
}
function playRemote(text,slow=false){
 return new Promise(resolve=>{
  if(currentAudio)currentAudio.pause();const a=new Audio(googleUrl(text,slow));currentAudio=a;a.onended=()=>resolve(true);a.onerror=()=>resolve(false);a.play().catch(()=>resolve(false))
 })
}
async function play(text,mode="normal"){
 const rate=mode==="slow"?.72:1;
 if(await playNative(text,rate)){toastMsg("Audio nativo");return}
 const engine=S.settings.engine;
 if(engine==="system"||engine==="auto"){
   const ok=await playSystem(text,rate);if(ok)return;
   if(engine==="system"){toastMsg("No hay voz vietnamita del sistema.");return}
 }
 if(engine==="remote"||engine==="auto"){
   const ok=await playRemote(text,mode==="slow");if(ok)return;
 }
 toastMsg("No se pudo reproducir. Ve a Audio para elegir otra voz o grabar una nativa.");
}
async function playSequence(ds){
 for(const x of dayItems(ds)){await play(x.vi,"normal");await new Promise(r=>setTimeout(r,450))}
}
function stop(){if(currentAudio){currentAudio.pause();currentAudio=null}if("speechSynthesis"in window)speechSynthesis.cancel()}

async function startRec(text){
 if(!navigator.mediaDevices?.getUserMedia){toastMsg("Este navegador no permite grabar.");return}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});recChunks=[];recordingFor=text;mediaRecorder=new MediaRecorder(stream);
  mediaRecorder.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
  mediaRecorder.onstop=async()=>{const blob=new Blob(recChunks,{type:mediaRecorder.mimeType||"audio/webm"});await dbPut(keyFor(recordingFor),blob);stream.getTracks().forEach(t=>t.stop());toastMsg("Audio nativo guardado ✓");render()};
  mediaRecorder.start();toastMsg("Grabando… pulsa Detener");
 }catch(e){toastMsg("No se pudo acceder al micrófono.")}
}
function stopRec(){if(mediaRecorder&&mediaRecorder.state==="recording")mediaRecorder.stop()}
async function uploadNative(text,input){const f=input.files?.[0];if(!f)return;await dbPut(keyFor(text),f);toastMsg("Audio nativo guardado ✓");render()}
async function removeNative(text){await dbDel(keyFor(text));toastMsg("Audio nativo eliminado");render()}

function toggleLearn(id,v){const s=state(id);s.learned=v;if(v){s.learnedAt=s.learnedAt||iso();s.stage=Math.max(1,s.stage||0);s.next=addDays(iso(),1)}else{s.next=null;s.stage=0}save();render()}
function markReal(id,v){state(id).real=v;save();render()}
function reviewGrade(id,hard){const s=state(id),ints=[1,3,7,14,30,60];if(hard){s.hard++;s.stage=Math.max(1,(s.stage||1)-1);s.next=addDays(iso(),1)}else{s.correct++;s.stage=Math.min(6,(s.stage||1)+1);s.next=addDays(iso(),ints[Math.min(5,s.stage-1)])}save();render()}

function head(t,s,e=""){return `<div class="head"><div><h1>${t}</h1><div class="sub">${s}</div></div><div class="tools">${e}<span class="pill">${selectedVoice?"🔊 "+esc(selectedVoice.name):"🔊 sin voz local"}</span></div></div>`}
function formatDate(ds){return new Date(ds+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function monthName(ds){return({9:"SEPTIEMBRE",10:"OCTUBRE",11:"NOVIEMBRE",12:"DICIEMBRE"})[+ds.slice(5,7)]}
function render(){const r=route(),p=r.split("/");document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.route===p[0]));if(p[0]==="day")return renderDay(p[1]);({home:renderHome,calendar:renderCalendar,review:renderReview,library:renderLibrary,reference:renderReference,audio:renderAudio,progress:renderProgress}[p[0]]||renderHome)()}
function renderHome(){const ds=currentDate(),ar=dayItems(ds),all=learnedCount();app.innerHTML=head("Hoy · "+formatDate(ds),"5 elementos, audio de mejor calidad y contexto correcto.")+`<div class="hero"><div class="card"><h2>Escucha bien.<br><span class="accent">Imita mejor.</span></h2><p class="muted">La voz robótica anterior ha sido eliminada. Ahora la página prioriza audio nativo, después la mejor voz vietnamita instalada en tu dispositivo y, si hace falta, un TTS online.</p><div class="progress"><i style="width:${pct(all,610)}%"></i></div><div class="sub">${all}/610 aprendidos</div><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-route="day/${ds}">Abrir las 5 de hoy</button><button class="btn" onclick="A.seq('${ds}')">▶ Escuchar las 5</button><button class="btn" data-route="audio">Configurar audio</button></div></div><div class="card metric"><small>Hoy</small><strong>${learnedCount(ar)}/5</strong><span class="muted">aprendidas</span><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><small>Repaso</small><strong>${dueItems().length}</strong><span class="muted">para hoy</span></div></div><div class="section"><h2>Las 5 de hoy</h2></div><div class="grid g2">${ar.map(exprCard).join("")}</div>`}
function renderDay(ds){const ar=dayItems(ds);if(!ar.length)return go("calendar");app.innerHTML=head(formatDate(ds),`${learnedCount(ar)}/5 aprendidas · Día ${ar[0].dayIndex} de 122`,`<button class="btn sm" data-route="calendar">← Calendario</button>`)+`<div class="card note"><b>Secuencia recomendada:</b> intenta decirla → mira fonética → escucha normal → escucha lenta → repite ×3 → marca aprendida.</div><div class="audio-row"><button class="btn primary" onclick="A.seq('${ds}')">▶ Escuchar las 5</button><button class="btn" data-route="audio">Elegir voz</button></div><div class="section"><h2>Aprendizaje</h2></div><div class="grid g2">${ar.map(exprCard).join("")}</div>`}
function exprCard(x){const s=state(x.id);return `<article class="card expr ${s.learned?"learned":""}"><div class="expr-top"><input class="check" type="checkbox" ${s.learned?"checked":""} onchange="A.learn(${x.id},this.checked)"><div style="flex:1"><div class="es">${esc(x.es)}</div><div class="vi">${esc(x.vi)}</div><div class="phon">${S.settings.phon?esc(x.phon):"••••••"}</div><div class="meta"><span class="badge">${esc(x.type)}</span>${s.real?'<span class="badge">✓ usada</span>':""}</div><div class="audio-row"><button class="audio-btn" onclick='A.play(${JSON.stringify(x.vi)},"normal")'>🔊 Normal</button><button class="audio-btn slow" onclick='A.play(${JSON.stringify(x.vi)},"slow")'>🐢 Lento</button><button class="audio-btn native" onclick='A.play(${JSON.stringify(x.vi)},"normal")'>★ Mejor disponible</button></div><div class="recbar"><button class="btn sm rec" onclick='A.rec(${JSON.stringify(x.vi)})'>● Grabar nativo</button><button class="btn sm" onclick="A.stopRec()">■ Detener</button><label class="btn sm">Subir audio<input type="file" accept="audio/*" style="display:none" onchange='A.upload(${JSON.stringify(x.vi)},this)'></label></div></div></div><div class="context"><div class="muted">AHORA ÚSALA EN CONTEXTO</div><div>${esc(x.ctx_es)}</div><div class="ctxvi">${esc(x.ctx_vi)}</div><div class="ctxph">${S.settings.phon?esc(x.ctx_phon):""}</div><div class="audio-row"><button class="audio-btn" onclick='A.play(${JSON.stringify(x.ctx_vi)},"normal")'>🔊 Contexto</button><button class="audio-btn slow" onclick='A.play(${JSON.stringify(x.ctx_vi)},"slow")'>🐢 Lento</button><label class="pill"><input type="checkbox" ${s.real?"checked":""} onchange="A.real(${x.id},this.checked)"> La he usado</label></div></div></article>`}
function renderCalendar(){let h="",last="";for(const ds of [...new Set(ITEMS.map(x=>x.date))]){const ar=dayItems(ds),m=monthName(ds),done=ar.every(x=>state(x.id).learned);if(m!==last){h+=`<div class="month-title">${m}</div>`;last=m}h+=`<button class="card daybtn ${done?"done":""} ${ds===currentDate()?"current":""}" data-route="day/${ds}"><div class="dn">${ds.slice(8,10)} ${m.slice(0,3)}</div><b>${learnedCount(ar)}/5</b><small>Día ${ar[0].dayIndex}</small></button>`}app.innerHTML=head("Calendario","1 septiembre → 31 diciembre · 5 elementos diarios.")+`<div class="days">${h}</div>`}
function renderReview(){const ar=dueItems();app.innerHTML=head("Repaso","1 → 3 → 7 → 14 → 30 → 60 días.")+`<div class="card">${ar.length?ar.map(x=>`<div class="reviewrow"><div><b>${esc(x.es)}</b><div class="vi">${esc(x.vi)}</div><div class="phon">${esc(x.phon)}</div><button class="audio-btn" onclick='A.play(${JSON.stringify(x.vi)},"normal")'>🔊</button></div><div><button class="btn gold sm" onclick="A.grade(${x.id},true)">Me costó</button> <button class="btn primary sm" onclick="A.grade(${x.id},false)">Lo sé</button></div></div>`).join(""):'<div class="muted" style="padding:25px;text-align:center">Sin repasos vencidos.</div>'}</div>`}
function renderLibrary(){app.innerHTML=head("Biblioteca","610 elementos.")+`<div class="filters"><input id="q" class="input" placeholder="Buscar español o vietnamita…"></div><div id="lib"></div>`;const draw=()=>{const s=q.value.toLowerCase(),ar=ITEMS.filter(x=>(x.es+x.vi+x.ctx_es+x.ctx_vi).toLowerCase().includes(s));lib.innerHTML=`<div class="tablebox"><table class="table"><thead><tr><th>Fecha</th><th>Español</th><th>Vietnamita</th><th>Fonética</th><th>Audio</th></tr></thead><tbody>${ar.map(x=>`<tr><td><button class="btn sm" data-route="day/${x.date}">${x.date.slice(8,10)}/${x.date.slice(5,7)}</button></td><td>${esc(x.es)}</td><td class="vi">${esc(x.vi)}</td><td class="phon">${esc(x.phon)}</td><td><button class="audio-btn" onclick='A.play(${JSON.stringify(x.vi)},"normal")'>🔊</button></td></tr>`).join("")}</tbody></table></div>`};q.oninput=draw;draw()}
function renderReference(){const tbl=(title,key)=>`<div class="section"><h2>${title}</h2></div><div class="tablebox"><table class="table"><tbody>${(REFS[key]||[]).map(r=>`<tr><td>${esc(r[0])}</td><td class="vi">${esc(r[1])}</td><td class="phon">${esc(r[2]||"")}</td><td><button class="audio-btn" onclick='A.play(${JSON.stringify(r[1])},"normal")'>🔊</button></td></tr>`).join("")}</tbody></table></div>`;app.innerHTML=head("Números y fechas","Referencia que no consume tus cinco elementos.")+tbl("Números","numbers")+tbl("Días","weekdays")+tbl("Meses","months")+tbl("Tratamientos","pronouns")}
function renderAudio(){
 loadVoices();
 app.innerHTML=head("Audio · configuración","Aquí decides qué voz utilizar. Audio nativo siempre gana.")+`
 <div class="grid g2"><div class="card"><h2>1. Voz del dispositivo</h2><p class="muted">Chrome/Android expone las voces instaladas mediante Web Speech. Selecciona una vietnamita y prueba varias: la calidad depende del motor instalado en tu móvil.</p><select class="select" style="width:100%" onchange="A.voice(this.value)">${viVoices.length?viVoices.map(v=>`<option value="${esc(v.name)}" ${selectedVoice?.name===v.name?"selected":""}>${esc(v.name)} · ${esc(v.lang)}${v.default?" · default":""}</option>`).join(""):'<option>No se detectó voz vi-VN</option>'}</select><div class="status ${selectedVoice?"ok":"bad"}">${selectedVoice?"Voz vietnamita detectada: "+esc(selectedVoice.name):"No hay voz vietnamita instalada. En Android puedes instalar datos de voz vietnamita y volver a abrir la página."}</div><button class="btn" style="margin-top:10px" onclick='A.play("Xin chào. Tôi đang học tiếng Việt.","normal")'>Probar voz</button></div>
 <div class="card"><h2>2. Motor preferido</h2><select class="select" style="width:100%" onchange="A.engine(this.value)"><option value="auto" ${S.settings.engine==="auto"?"selected":""}>Automático: nativo → sistema → online</option><option value="system" ${S.settings.engine==="system"?"selected":""}>Solo voz del dispositivo</option><option value="remote" ${S.settings.engine==="remote"?"selected":""}>Solo TTS online</option></select><p class="muted">El fallback online utiliza el lector de Google Translate. Necesita Internet y es un servicio externo no documentado como API pública estable, por lo que la voz del dispositivo o las grabaciones nativas son preferibles.</p></div></div>
 <div class="section"><h2>La mejor solución para Saigón</h2></div><div class="card note"><b>Para pronunciación realmente local:</b> graba a tu profesora/pareja/amigo vietnamita en las expresiones que estudias. En cuanto una expresión tiene audio nativo guardado, la plataforma lo reproduce antes que cualquier TTS. El audio queda almacenado en este navegador mediante IndexedDB.</div>
 <div class="section"><h2>Velocidad</h2></div><div class="card"><input type="range" min=".65" max="1.1" step=".05" value="${S.settings.speed}" oninput="A.speed(this.value);sv.textContent=this.value+'×'"><b id="sv" style="margin-left:10px">${S.settings.speed}×</b></div>`;
}
function renderProgress(){app.innerHTML=head("Progreso","Aprendidas, utilizadas y repasadas.")+`<div class="grid g4"><div class="card metric"><small>Aprendidas</small><strong>${learnedCount()}</strong><span class="muted">/610</span></div><div class="card metric"><small>Usadas</small><strong>${ITEMS.filter(x=>state(x.id).real).length}</strong></div><div class="card metric"><small>Repasos</small><strong>${dueItems().length}</strong></div><div class="card metric"><small>Voz local</small><strong style="font-size:18px">${selectedVoice?"Sí":"No"}</strong></div></div>`}
const A={play,seq:playSequence,stop,learn:toggleLearn,real:markReal,grade:reviewGrade,rec:startRec,stopRec,upload:uploadNative,removeNative,
 voice(n){S.settings.voiceName=n;save();loadVoices();renderAudio()},engine(v){S.settings.engine=v;save()},speed(v){S.settings.speed=+v;save()}};
window.A=A;render();
</script>
</body></html>
