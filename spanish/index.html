const STORE_KEY="spanish30_english_v1";
const DEFAULT={accent:"spain",states:{},days:{},minutes:[],settings:{phonetics:true},custom:[]};
let S=safeLoad();
let currentQueue=[],queueIndex=0,queueMode="review";
let voices=[],spanishVoice=null,currentListen=null;
const app=document.getElementById("app"),modal=document.getElementById("modal"),modalBody=document.getElementById("modalBody");

function safeLoad(){try{const x=localStorage.getItem(STORE_KEY);if(x)return Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(x));}catch(e){}return JSON.parse(JSON.stringify(DEFAULT))}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){}}
function st(id){if(!S.states[id])S.states[id]={level:0,good:0,bad:0,next:null,seen:0,real:false};return S.states[id]}
function today(){return new Date().toISOString().slice(0,10)}
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function escapeH(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1500)}
function pct(a,b){return b?Math.round(a/b*100):0}
function levelDots(n){return `<span class="level">${[1,2,3,4].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`}
function learned(arr=ITEMS){return arr.filter(x=>st(x.id).level>=2).length}
function automatic(arr=ITEMS){return arr.filter(x=>st(x.id).level>=4).length}
function currentDay(){const start=new Date("2026-09-01T00:00:00"),now=new Date();return Math.max(1,Math.min(30,Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-start)/86400000)+1))}
function due(){const t=today();return ITEMS.filter(x=>st(x.id).seen&&(!st(x.id).next||st(x.id).next<=t)&&st(x.id).level<4)}
function dayItems(d){return ITEMS.filter(x=>x.day===+d)}
function moduleItems(m){return ITEMS.filter(x=>x.module===m)}
function cue(x){return S.accent==="latam"?x.ph_la:x.ph_es}
function audioAvailable(){return !!spanishVoice}
function speak(text,rate=.88){if(!spanishVoice||!("speechSynthesis"in window))return toast("No compatible Spanish voice is available on this device.");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=spanishVoice.lang;u.voice=spanishVoice;u.rate=rate;speechSynthesis.speak(u)}
function detectVoices(){if(!("speechSynthesis"in window))return;voices=speechSynthesis.getVoices();const wanted=S.accent==="spain"?["es-ES"]:["es-MX","es-US","es-419","es-AR","es-CO","es-CL","es-PE"];spanishVoice=null;for(const code of wanted){spanishVoice=voices.find(v=>v.lang&&v.lang.toLowerCase()===code.toLowerCase());if(spanishVoice)break}if(!spanishVoice){spanishVoice=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("es")&&(S.accent==="spain"?/es[-_]es/i.test(v.lang):!/es[-_]es/i.test(v.lang)))||null}}
if("speechSynthesis"in window){detectVoices();speechSynthesis.onvoiceschanged=()=>{detectVoices();renderRoute()}}

function go(route){location.hash="#"+route}
function route(){return (location.hash||"#home").slice(1)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-route]");if(b){e.preventDefault();go(b.dataset.route)}})

function header(title,sub){return `<div class="header"><div><h1>${escapeH(title)}</h1><div class="sub">${escapeH(sub)}</div></div><div class="tools"><button class="btn sm" onclick="App.toggleAccent()">${S.accent==="spain"?"🇪🇸 Spain":"🌎 Latin America"}</button><span class="pill">${audioAvailable()?"🔊 Spanish voice ready":"Audio hidden: no matching Spanish voice"}</span></div></div>`}
function renderRoute(){
 const r=route(),a=r.split("/");
 document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("active",x.dataset.route===a[0]));
 if(a[0]==="day")return renderDay(+a[1]);
 if(a[0]==="module")return renderModule(a[1]);
 const fn={home:renderHome,plan:renderPlan,modules:renderModules,library:renderLibrary,review:renderReview,pronunciation:renderPronunciation,listening:renderListening,conversation:renderConversation,errors:renderErrors,progress:renderProgress}[a[0]]||renderHome;
 fn();
}
function renderHome(){
 const d=currentDay(),m=META[d],di=dayItems(d),l=learned(di),all=learned(),auto=automatic(),du=due().length;

function renderModules(){

}
function table(arr){
 return `<div class="tablebox"><table class="table"><thead><tr><th>English</th><th>Spanish</th><th>Pronunciation cue</th><th>Level</th><th></th></tr></thead><tbody>${arr.map(x=>`<tr><td class="source">${escapeH(x.en)}</td><td class="target">${escapeH(x.es)}</td><td class="phon">${S.settings.phonetics?escapeH(cue(x)):"Hidden"}</td><td>${levelDots(st(x.id).level)}</td><td style="white-space:nowrap">${audioAvailable()?`<button class="btn sm" onclick='App.say(${JSON.stringify(x.es)})'>🔊</button>`:""} <button class="btn sm" onclick="App.openItem(${x.id})">Open</button></td></tr>`).join("")}</tbody></table></div>`;
}
function renderDay(d){
 if(!META[d])return go("plan");
 const ar=dayItems(d),m=META[d],l=learned(ar);
 app.innerHTML=header(`Day ${d} · ${m.title}`,m.desc)+`
 <div class="grid g2"><div class="card"><div class="kicker">TODAY'S OUTCOME</div><h2>${escapeH(m.goal)}</h2><p class="muted">${escapeH(m.mission)}</p><div class="progress"><i style="width:${pct(l,20)}%"></i></div><div class="sub">${l}/20 learned</div>
 <div style="margin-top:15px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="App.startDay(${d})">▶ Start Day ${d}</button><button class="btn" onclick="App.practiceDay(${d})">Practice all 20</button></div></div>
 <div class="card"><h3>Pronunciation focus</h3>${pronFocus(ar.map(x=>x.es).join(" "))}<p class="muted">The cue is deliberately English-friendly, not IPA. Capital letters mark the stressed syllable.</p><button class="btn sm" onclick="App.togglePhonetics()">${S.settings.phonetics?"Hide":"Show"} pronunciation cues</button></div></div>
 <div class="section"><h2>20 core expressions</h2></div>${table(ar)}
 <div class="section"><h2>Mission</h2></div><div class="card mission"><p>${escapeH(m.mission)}</p><label><input type="checkbox" onchange="App.completeDay(${d},this.checked)" ${S.days[d]?.complete?"checked":""}> I completed today's real-world mission.</label></div>`;
}
function renderModule(id){
 const m=MODULES.find(x=>x.id===id);if(!m)return go("modules");const ar=moduleItems(id);
 app.innerHTML=header(m.name,m.desc)+`<div class="grid g3"><div class="card metric"><small>Expressions</small><strong>${ar.length}</strong></div><div class="card metric"><small>Learned</small><strong>${learned(ar)}</strong></div><div class="card metric"><small>Automatic</small><strong>${automatic(ar)}</strong></div></div><div class="section"><h2>Module library</h2></div>${table(ar)}`;
}
function renderLibrary(){
 app.innerHTML=header("600-Phrase Library","Search everything. Use English to locate; train Spanish to retrieve.")+`<div class="filters"><input id="search" class="input" placeholder="Search English or Spanish…"><select id="dayFilter" class="select"><option value="">All days</option>${Array.from({length:30},(_,i)=>`<option value="${i+1}">Day ${i+1}</option>`).join("")}</select><button class="btn sm" onclick="App.togglePhonetics()">${S.settings.phonetics?"Hide":"Show"} phonetics</button></div><div id="lib"></div>`;
 const searchEl=document.getElementById("search"),dayEl=document.getElementById("dayFilter"),libEl=document.getElementById("lib");const draw=()=>{const q=searchEl.value.toLowerCase(),d=dayEl.value;let ar=ITEMS.filter(x=>(!q||(x.en+x.es).toLowerCase().includes(q))&&(!d||x.day==d));libEl.innerHTML=table(ar)};searchEl.oninput=draw;dayEl.onchange=draw;draw();
}
function pronFocus(text){
 const s=text.toLowerCase(),notes=[];
 if(/[rz]/.test(s))notes.push("<b>R / RR:</b> Spanish uses a tongue tap for single r and a trill for rr or initial r.");
 if(/[j]|g[eiéí]/.test(s))notes.push("<b>J / GE / GI:</b> strong breathy h-like sound; never English j.");
 if(/ñ/.test(s))notes.push("<b>Ñ:</b> like ny in canyon.");
 if(/h/.test(s))notes.push("<b>H:</b> silent.");
 if(/[z]|c[eiéí]/.test(s))notes.push(`<b>C/Z:</b> ${S.accent==="spain"?"th as in think in much of Spain":"s in Latin American Spanish"}.`);
 if(/[bv]/.test(s))notes.push("<b>B/V:</b> Spanish b and v are much closer than in English; do not force a strong English v.");
 if(/ll|y/.test(s))notes.push("<b>LL/Y:</b> usually y-like for this course.");
 return notes.length?notes.map(n=>`<div class="note" style="margin-bottom:7px">${n}</div>`).join(""):`<div class="note">Keep all five vowels pure: a=ah, e=eh, i=ee, o=oh, u=oo. Avoid English-style vowel reduction.</div>`;
}
function renderReview(){
 const ar=due();
 app.innerHTML=header("Smart Review","Difficult phrases return sooner; automatic phrases are spaced out.")+`<div class="grid g3"><div class="card metric"><small>Due now</small><strong>${ar.length}</strong></div><div class="card metric"><small>Total errors</small><strong>${Object.values(S.states).reduce((a,x)=>a+x.bad,0)}</strong></div><div class="card metric"><small>Automatic</small><strong>${automatic()}</strong></div></div><div class="card" style="margin-top:15px;text-align:center"><h2>${ar.length?"Ready to retrieve":"Nothing due right now"}</h2><p class="muted">${ar.length?"English appears first. Say Spanish before revealing it.":"You can practice today's set instead."}</p><button class="btn primary" onclick="App.beginReview()">${ar.length?"Review "+Math.min(ar.length,30)+" items":"Practice today's 20"}</button></div>`;
}
function renderPronunciation(){
 const ar=ITEMS.filter(x=>st(x.id).level>=1).sort(()=>Math.random()-.5).slice(0,12);
 app.innerHTML=header("Pronunciation Lab","English speakers improve fastest by fixing a few high-impact Spanish sound habits.")+`
 <div class="grid g2"><div class="card"><h3>Your pronunciation model</h3><p class="muted">Current model: <b>${S.accent==="spain"?"Spain Spanish":"Latin American Spanish"}</b>.</p>${audioAvailable()?`<p>✓ A matching Spanish TTS voice was detected. Audio buttons are enabled.</p>`:`<p class="audio-off">No matching Spanish voice was detected. Audio is intentionally disabled rather than using the wrong voice.</p>`}<button class="btn" onclick="App.toggleAccent()">Switch accent model</button></div><div class="card"><h3>Five rules worth more than 50 rules</h3><p>1. Pure vowels. 2. Tap/trill R. 3. J is not English J. 4. H is silent. 5. Spanish rhythm is syllable-timed: do not swallow unstressed vowels.</p></div></div>
 <div class="section"><h2>Pronunciation drill</h2></div>${ar.length?table(ar):`<div class="card empty">Learn a few expressions first, then return here.</div>`}`;
}
function renderListening(){
 if(!audioAvailable()){app.innerHTML=header("Listening Lab","Audio appears only when the device exposes a matching Spanish voice.")+`<div class="card empty"><h2>No reliable Spanish voice detected</h2><p>Listening is intentionally disabled on this device. Use Pronunciation cues, real human audio, or switch to a device/browser with a Spanish voice installed.</p></div>`;return}
 app.innerHTML=header("Listening Lab","Hear Spanish first. Choose meaning without reading the target sentence.")+`<div class="card drill" id="listenBox"></div>`;nextListening();
}
function nextListening(){
 const pool=ITEMS.filter(x=>st(x.id).level>0||x.day<=currentDay());currentListen=pool[Math.floor(Math.random()*pool.length)];const opts=[currentListen,...pool.filter(x=>x.id!==currentListen.id).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);const box=document.getElementById("listenBox");if(!box)return;box.innerHTML=`<div style="text-align:center"><div class="kicker">LISTEN FIRST</div><h2>What does it mean?</h2><button class="btn primary" onclick='App.say(${JSON.stringify(currentListen.es)},.84)'>🔊 Play Spanish</button><div class="grid g2" style="margin-top:18px">${opts.map(o=>`<button class="btn" style="text-align:left" onclick="App.answerListening(${o.id},this)">${escapeH(o.en)}</button>`).join("")}</div></div>`;setTimeout(()=>speak(currentListen.es,.84),200)
}
function renderConversation(){
 const d=currentDay(),m=META[d];
 app.innerHTML=header("Conversation Lab","Turn learned language into spontaneous speech.")+`<div class="grid g2"><div class="card mission"><div class="kicker">TODAY'S MISSION</div><h2>${escapeH(m.goal)}</h2><p>${escapeH(m.mission)}</p><div class="checklist"><label><input type="checkbox"> I stayed in Spanish when I got stuck.</label><label><input type="checkbox"> I asked follow-up questions.</label><label><input type="checkbox"> I used at least five phrases from today's set.</label><label><input type="checkbox"> I corrected one recurring pronunciation issue.</label></div></div><div class="card"><h3>Log a conversation</h3><label class="muted">Minutes in Spanish</label><input id="mins" class="input" type="number" value="10" min="1" style="width:100%;margin:5px 0 10px"><label class="muted">Longest continuous stretch without English</label><input id="noeng" class="input" type="number" value="5" min="0" style="width:100%;margin:5px 0 12px"><button class="btn primary" onclick="App.logConversation()">Save practice</button></div></div>
 <div class="section"><h2>Rapid role-plays</h2></div><div class="grid g3">${["Meeting someone","Restaurant","Transport","Problem","Work","Opinion"].map((x,i)=>`<div class="card"><h3>${x}</h3><p class="muted">${["Introduce yourself, discover five facts, share three.","Order, modify, ask, react, pay.","Ask, confirm, change and arrive.","Explain cause, attempt, need and alternative.","Explain your job simply and ask about theirs.","Position, two reasons, contrast and example."][i]}</p></div>`).join("")}</div>`;
}
function renderErrors(){
 const ar=ITEMS.map(x=>({x,s:st(x.id)})).filter(z=>z.s.bad).sort((a,b)=>b.s.bad-a.s.bad).slice(0,30);
 app.innerHTML=header("Error List","Your recurring errors are more valuable than another random list of new words.")+(ar.length?`<div class="tablebox"><table class="table"><thead><tr><th>English</th><th>Spanish</th><th>Errors</th><th></th></tr></thead><tbody>${ar.map(z=>`<tr><td>${escapeH(z.x.en)}</td><td class="target">${escapeH(z.x.es)}</td><td>${z.s.bad}</td><td><button class="btn sm" onclick="App.single(${z.x.id})">Practice</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="card empty">No errors recorded yet. Start a review or day session.</div>`);
}
function renderProgress(){
 const total=learned(),auto=automatic(),min=S.minutes.reduce((a,x)=>a+x.min,0),best=Math.max(0,...S.minutes.map(x=>x.noeng||0));
 app.innerHTML=header("Progress","Track real capacity, not game points.")+`<div class="grid g4"><div class="card metric"><small>Learned</small><strong>${total}</strong><span class="muted">/600</span></div><div class="card metric"><small>Automatic</small><strong>${auto}</strong></div><div class="card metric"><small>Spanish minutes</small><strong>${min}</strong></div><div class="card metric"><small>Best no-English stretch</small><strong>${best}'</strong></div></div><div class="section"><h2>30-day map</h2></div><div class="days">${Array.from({length:30},(_,i)=>{const d=i+1,l=learned(dayItems(d));return `<button data-route="day/${d}" class="card day" style="text-align:left;color:inherit"><div class="num">DAY ${d}</div><h3>${escapeH(META[d].title)}</h3><div class="progress"><i style="width:${pct(l,20)}%"></i></div><span class="tag">${l}/20 · ${S.days[d]?.complete?"mission ✓":"mission pending"}</span></button>`}).join("")}</div><div class="section"><h2>Backup</h2></div><div class="card"><button class="btn" onclick="App.exportData()">Export progress JSON</button> <label class="btn">Import JSON<input type="file" accept=".json" style="display:none" onchange="App.importData(this)"></label></div>`;
}
function openItem(id){
 const x=ITEMS.find(z=>z.id===id);if(!x)return;const s=st(id);
 modalBody.innerHTML=`<div class="detail-head"><div><div class="kicker">DAY ${x.day}</div><h2 style="margin:4px 0">${escapeH(x.en)}</h2></div><button class="btn sm" onclick="App.close()">✕</button></div><div class="big-es">${escapeH(x.es)}</div><div class="big-ph">${S.settings.phonetics?escapeH(cue(x)):"Pronunciation cue hidden"}</div><div style="margin:18px 0">${pronFocus(x.es)}</div>${audioAvailable()?`<button class="btn" onclick='App.say(${JSON.stringify(x.es)})'>🔊 Play Spanish</button>`:`<div class="audio-off">Audio is disabled because this browser/device does not expose a matching Spanish voice.</div>`}<div class="section"><h2>Mastery</h2></div><div class="grades"><button class="grade bad" onclick="App.gradeItem(${id},0)">Don't know</button><button class="grade hard" onclick="App.gradeItem(${id},1)">Hard</button><button class="grade good" onclick="App.gradeItem(${id},2)">Know it</button><button class="grade auto" onclick="App.gradeItem(${id},3)">Automatic</button></div><label style="display:block;margin-top:15px"><input type="checkbox" onchange="App.real(${id},this.checked)" ${s.real?"checked":""}> I have used this in real conversation.</label>`;
 modal.classList.add("open");
}
function grade(id,g){const s=st(id),t=today();s.seen++;if(g===0){s.bad++;s.level=Math.max(1,s.level-1);s.next=t}else if(g===1){s.good++;s.level=Math.max(1,s.level);s.next=addDays(t,1)}else if(g===2){s.good++;s.level=Math.max(3,s.level);s.next=addDays(t,3)}else{s.good++;s.level=4;s.next=addDays(t,8)}save()}
function queueRender(){
 const x=currentQueue[queueIndex];if(!x){modal.classList.remove("open");toast("Session saved ✓");renderRoute();return}
 modalBody.innerHTML=`<div style="display:flex;justify-content:space-between"><span class="pill">${queueIndex+1}/${currentQueue.length}</span><button class="btn sm" onclick="App.close()">✕</button></div><div class="flash"><div class="prompt">${escapeH(x.en)}</div><p class="muted">Say the Spanish aloud before revealing it.</p><button class="btn" onclick="App.reveal()">Reveal Spanish</button><div id="ans" class="answer hidden"><div class="es">${escapeH(x.es)}</div><div class="ph">${S.settings.phonetics?escapeH(cue(x)):""}</div>${audioAvailable()?`<button class="btn sm" style="margin-top:10px" onclick='App.say(${JSON.stringify(x.es)})'>🔊</button>`:""}</div></div><div id="qgrades" class="grades hidden"><button class="grade bad" onclick="App.qgrade(0)">Didn't know</button><button class="grade hard" onclick="App.qgrade(1)">Hard</button><button class="grade good" onclick="App.qgrade(2)">Knew it</button><button class="grade auto" onclick="App.qgrade(3)">Automatic</button></div>`;
}
function pronDrillForDay(d){
 const ar=dayItems(d).slice(0,5);modalBody.innerHTML=`<div style="display:flex;justify-content:space-between"><h2>Pronunciation · Day ${d}</h2><button class="btn sm" onclick="App.close()">✕</button></div>${ar.map(x=>`<div class="card" style="margin-bottom:9px"><div class="target">${escapeH(x.es)}</div><div class="phon">${escapeH(cue(x))}</div>${audioAvailable()?`<button class="btn sm" onclick='App.say(${JSON.stringify(x.es)},.78)'>🔊 Listen slowly</button>`:""}<div style="margin-top:7px">${pronFocus(x.es)}</div></div>`).join("")}<button class="btn primary" onclick="App.practiceDay(${d})">Continue to production</button>`;
 modal.classList.add("open");
}
function startDay(d){currentQueue=dayItems(d);queueIndex=0;queueMode="day";modal.classList.add("open");pronDrillForDay(d)}
function practiceDay(d){currentQueue=dayItems(d);queueIndex=0;queueMode="day";modal.classList.add("open");queueRender()}
function beginReview(){currentQueue=(due().length?due():dayItems(currentDay())).slice(0,30);queueIndex=0;queueMode="review";modal.classList.add("open");queueRender()}

const App={
 go,toggleAccent(){S.accent=S.accent==="spain"?"latam":"spain";save();detectVoices();renderRoute()},
 togglePhonetics(){S.settings.phonetics=!S.settings.phonetics;save();renderRoute()},
 say:speak,openItem,close(){modal.classList.remove("open")},
 gradeItem(id,g){grade(id,g);save();openItem(id);toast("Saved")},
 real(id,v){st(id).real=v;save()},
 startDay,practiceDay,beginReview,single(id){currentQueue=[ITEMS.find(x=>x.id===id)];queueIndex=0;modal.classList.add("open");queueRender()},
 reveal(){document.getElementById("ans")?.classList.remove("hidden");document.getElementById("qgrades")?.classList.remove("hidden")},
 qgrade(g){grade(currentQueue[queueIndex].id,g);queueIndex++;save();queueRender()},
 completeDay(d,v){S.days[d]=Object.assign(S.days[d]||{},{complete:v});save();toast(v?"Mission completed ✓":"Mission reopened")},
 logConversation(){const min=+document.getElementById("mins").value||0,no=+document.getElementById("noeng").value||0;if(min){S.minutes.push({date:today(),min,noeng:no});save();toast("Conversation logged ✓");renderConversation()}},
 answerListening(id,el){if(!currentListen)return;if(id===currentListen.id){el.style.borderColor="var(--green)";grade(currentListen.id,2);toast("Correct ✓")}else{el.style.borderColor="var(--red)";grade(currentListen.id,0);toast("Listen again")};save();setTimeout(nextListening,900)},
 exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="spanish30-progress.json";a.click();URL.revokeObjectURL(a.href)},
 importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(r.result));save();toast("Progress imported ✓");renderRoute()}catch(e){toast("Invalid JSON file")}};r.readAsText(f)}
};
window.App=App;
modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("open")});
window.addEventListener("keydown",e=>{if(e.key==="Escape")modal.classList.remove("open")});
renderRoute();
</script>
</body></html>
